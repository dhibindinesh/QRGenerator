<div class="min-h-screen bg-gray-50 transition-colors dark:bg-gray-900">

  <!-- Theme toggle -->
  <header class="flex items-center justify-end px-4 py-3">
    <button type="button" (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'" class="rounded-lg border border-gray-300 bg-white p-2 text-gray-600 transition
             hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500
             dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300
             dark:hover:bg-gray-700">
      @if (isDark()) {
      <!-- Sun icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-9H21m-18 0H3m15.36-6.36-.71.71M6.34 17.66l-.71.71
                   M17.66 17.66l.71.71M6.34 6.34l-.71-.71M12 5a7 7 0 1 0 0 14A7 7 0 0 0 12 5z" />
      </svg>
      } @else {
      <!-- Moon icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      }
    </button>
  </header>

  <!-- Main content -->
  <main class="flex min-h-[calc(100vh-56px)] items-start justify-center pt-6 pb-10">
    <app-qr-generator [value]="'https://google.com'" [size]="250" [autoGenerate]="true"
      (base64Generated)="onQrGenerated($event)" />
  </main>

</div>
